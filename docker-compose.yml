version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: procescheck_db
    environment:
      POSTGRES_USER: procescheck
      POSTGRES_PASSWORD: procescheck_dev
      POSTGRES_DB: procescheck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procescheck"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procescheck_backend
    environment:
      DATABASE_URL: postgresql://procescheck:procescheck_dev@db:5432/procescheck
      CORS_ORIGINS: "http://localhost:3300"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procescheck_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3300:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
